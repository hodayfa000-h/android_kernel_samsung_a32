name: Build Kernel

on:
  push:
    branches: [ Tweaks ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Verify susFS integration
        run: |
          echo "Checking susFS source files"
          ls fs/susfs.c fs/sus_su.c || (echo "susFS source files missing" && exit 1)

          echo "Checking susFS headers"
          ls include/linux/susfs.h \
             include/linux/sus_su.h \
             include/linux/susfs_def.h || (echo "susFS headers missing" && exit 1)

          echo "Checking defconfig flags"
          grep -E 'CONFIG_KSU_SUSFS_SUS_PATH=y' arch/arm64/configs/a32_defconfig || exit 1
          grep -E 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/a32_defconfig || exit 1
          grep -E 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' arch/arm64/configs/a32_defconfig || exit 1

          echo "susFS wiring verified"

      - name: Clone toolchains
        run: git clone https://github.com/FalconJaw/android-kernel-tools.git external_toolchains

      - name: Make build script executable
        run: chmod +x build_kernel.sh

      - name: Build kernel
        run: ./build_kernel.sh

      - name: Upload compiled Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel Image
          path: arch/arm64/boot/Image